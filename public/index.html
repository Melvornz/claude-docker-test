<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-lg mx-auto px-4 py-10">

    <header class="mb-8 text-center">
      <h1 class="text-4xl font-bold text-indigo-600">Todo App</h1>
      <p class="text-gray-500 mt-1 text-sm">Jednoduchý správce úkolů</p>
      <a
        href="https://github.com/Melvornz/claude-docker-test"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center gap-1.5 mt-3 text-xs text-gray-400 hover:text-indigo-600 transition-colors"
      >
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.483 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0112 6.844a9.59 9.59 0 012.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.741 0 .269.18.579.688.481C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
        </svg>
        Melvornz/claude-docker-test
      </a>
    </header>

    <div class="bg-white rounded-2xl shadow-md p-6 mb-6">
      <form id="todo-form" class="flex gap-3">
        <input
          id="todo-input"
          type="text"
          placeholder="Co potřebuješ udělat?"
          class="flex-1 border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
          maxlength="255"
          autocomplete="off"
        />
        <button
          type="submit"
          id="add-btn"
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2 rounded-lg text-sm transition-colors disabled:opacity-50"
        >
          Přidat
        </button>
      </form>
      <p id="form-error" class="text-red-500 text-xs mt-2 hidden"></p>
    </div>

    <div class="bg-white rounded-2xl shadow-md p-6">
      <div id="loading" class="text-center text-gray-400 py-8 text-sm">Načítám...</div>
      <ul id="todo-list" class="hidden space-y-3"></ul>
      <div id="empty-state" class="hidden text-center text-gray-400 py-8">
        <svg class="mx-auto mb-3 w-12 h-12 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
        </svg>
        <p class="text-sm">Žádné úkoly. Přidej první!</p>
      </div>
      <p id="list-error" class="text-red-500 text-xs text-center mt-2 hidden"></p>
    </div>

  </div>
  <script src="app.js"></script>
</body>
</html>
